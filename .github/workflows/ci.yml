# Runs the unit tests and the whole pipeline end to end on a 350 kb region.
name: pipeline-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}   # login shell so the micromamba env is active
    steps:
      - uses: actions/checkout@v4

      - name: Create the pinned environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/environment.yml
          cache-environment: true

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Run the pipeline on the CI region
        run: snakemake --cores 4 --configfile config/ci.yaml --printshellcmds

      - name: Check expected outputs exist and are non-empty
        run: |
          for f in results/tables/benchmark_summary.tsv results/tables/prioritized_variants.tsv \
                   results/tables/run_summary.md results/qc/multiqc_report.html \
                   figures/benchmark_comparison.png figures/error_profile.png figures/prioritization_summary.png; do
            test -s "$f" || { echo "missing: $f"; exit 1; }
          done
          cat results/tables/run_summary.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            results/tables/
            results/qc/multiqc_report.html
            figures/
            logs/
